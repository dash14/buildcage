name: Test / Unit
run-name: Test / Unit (${{ github.ref_name }})

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    name: changes
    if: github.event_name == 'pull_request'
    outputs:
      unit_test: ${{ steps.filter.outputs.unit_test }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            unit_test:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'rolldown.config.js'
              - 'rolldown.scripts.config.js'
              - 'tsconfig.json'
              - 'tsconfig.qjs.json'
              - 'vite.config.ts'
              - '.dockerignore'
              - '.github/actions/setup-vp/**'
              - '.github/workflows/test-unit.yml'
              - 'src/**'
              - 'docker/**'
              - 'report/**'
              - 'Makefile'

  unit_test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.unit_test == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "unit: test"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Test buildcage-runc (inspect engine)
        working-directory: docker/inspect/buildcage-runc
        run: go test ./...

      - name: Typecheck
        run: vp run typecheck

      - name: Check (lint/format)
        run: vp check

      - name: Build
        run: vp run build

      - name: Check dist is up to date
        run: git diff --exit-code

      - name: Check dist is free of the BUILDCAGE_BUILD_TEST_HOOKS test hooks
        run: |
          for f in dist/main.cjs dist/post.cjs report/dist/main.cjs; do
            if grep -q 'process\.env\.BUILDCAGE_BUILD_TEST_HOOKS' "$f"; then
              echo "::error::$f still contains a live process.env.BUILDCAGE_BUILD_TEST_HOOKS read — rolldown's replacePlugin failed to substitute it (see rolldown.config.js), leaving a test-only hook reachable in a published action. Do not merge until this passes."
              exit 1
            fi
            echo "confirmed: $f has no live BUILDCAGE_BUILD_TEST_HOOKS read — its test hooks are unreachable in this build."
          done

      - name: Run unit tests
        run: make test_unit

  # Single, stably-named required status check for branch protection: the
  # matrix-based integration/e2e jobs live in their own workflow files (see
  # test-integration.yml, test-e2e.yml) and can't be added to this `needs`
  # list across files, so branch protection targets one job per file instead.
  unit-tests-passed:
    name: Unit tests passed
    runs-on: ubuntu-latest
    needs: [changes, unit_test]
    if: always()
    permissions: {}
    steps:
      - name: Check whether all required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All required jobs succeeded."
